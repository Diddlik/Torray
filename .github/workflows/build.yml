name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Torray.slnx
      - run: dotnet test Torray.slnx --no-build
      - run: dotnet format Torray.slnx --verify-no-changes
